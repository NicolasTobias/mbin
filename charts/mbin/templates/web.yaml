apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mbin.fullname" . }}-web
  labels:
    {{- include "mbin.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "mbin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mbin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      containers:
        - name: web
          image: {{ include "mbin.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "mbin.fullname" . }}
            - secretRef:
                name: {{ include "mbin.secretName" . }}
          env:
            {{- include "mbin.env" . | nindent 12 }}
            - name: MERCURE_PUBLISHER_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mbin.secretName" . }}
                  key: MERCURE_JWT_SECRET
            - name: MERCURE_SUBSCRIBER_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mbin.secretName" . }}
                  key: MERCURE_JWT_SECRET
          ports:
            - name: http
              containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ .Values.web.preStopSleepSeconds | quote }}]
          # The entrypoint clears the cache and runs the database migrations
          # before Caddy starts listening, so allow plenty of time at startup.
          startupProbe:
            httpGet:
              path: /robots.txt
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
            {{- if and .Values.persistence.media.enabled (not .Values.s3.enabled) }}
            - name: media
              mountPath: /app/public/media
            {{- end }}
            {{- if include "mbin.oauthEnabled" . }}
            - name: oauth
              mountPath: /app/config/oauth2
              readOnly: true
            {{- end }}
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
        {{- if and .Values.persistence.media.enabled (not .Values.s3.enabled) }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-media" (include "mbin.fullname" .)) .Values.persistence.media.existingClaim }}
        {{- end }}
        {{- if include "mbin.oauthEnabled" . }}
        - name: oauth
          secret:
            secretName: {{ include "mbin.oauthSecretName" . }}
            items:
              - key: private.pem
                path: private.pem
              - key: public.pem
                path: public.pem
        {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mbin.fullname" . }}-web
  labels:
    {{- include "mbin.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "mbin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
{{- if and .Values.persistence.media.enabled (not .Values.s3.enabled) (not .Values.persistence.media.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mbin.fullname" . }}-media
  labels:
    {{- include "mbin.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.persistence.media.accessModes | nindent 4 }}
  {{- with .Values.persistence.media.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.media.size }}
{{- end }}
