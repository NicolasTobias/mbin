{{- if and (not .Values.oauth.existingSecret) .Values.oauth.privateKey .Values.oauth.publicKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mbin.oauthSecretName" . }}
  labels:
    {{- include "mbin.labels" . | nindent 4 }}
type: Opaque
stringData:
  private.pem: |
    {{- .Values.oauth.privateKey | nindent 4 }}
  public.pem: |
    {{- .Values.oauth.publicKey | nindent 4 }}
  passphrase: {{ .Values.oauth.passphrase | quote }}
{{- end }}
