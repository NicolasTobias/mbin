{{- if not .Values.secrets.existingSecret }}
{{- $name := include "mbin.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mbin.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "APP_SECRET" "MERCURE_JWT_SECRET" "POSTGRES_PASSWORD" "RABBITMQ_PASSWORD" "REDIS_PASSWORD" }}
  {{ $key }}: {{ if hasKey $existing $key }}{{ index $existing $key }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
  {{- end }}
  OAUTH_ENCRYPTION_KEY: {{ if hasKey $existing "OAUTH_ENCRYPTION_KEY" }}{{ index $existing "OAUTH_ENCRYPTION_KEY" }}{{ else }}{{ randAlphaNum 32 | sha256sum | trunc 32 | b64enc }}{{ end }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | toString | b64enc }}
  {{- end }}
{{- end }}
